kind: Secret
apiVersion: v1
metadata:
  labels:
    app: k6
  name: k6-config
type: Opaque
stringData: 
  script.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    // Define the base URL of your API
    const BASE_URL = __ENV.BASE_URL || 'http://orderservice.codersandbox.com';

    // Define the options for your test
    export let options = {
        stages: [
            { duration: '10s', target: 1 }, 
            { duration: '45s', target: 2 }, 
            { duration: '10s', target: 1 }  
        ],
    };

    // Define the main function that represents your test scenario
    export default function () {
        let body;
        let headers;
        let response;

        body = {
            "bookId": "cleancode",
            "quantity": 2
        };

        headers = {
            'Content-Type': 'application/json',
        };
        response = http.post(`${BASE_URL}/book`, JSON.stringify(body), { headers: headers });

        check(response, {
            'Status 200': (r) => r.status === 200,
        });

        sleep(3);

    } 
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: k6
  name: k6-job
spec:
  schedule: "*/7 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: k6
            image: "grafana/k6:0.58.0"
            args: ["run", "/scripts/script.js"]
            imagePullPolicy: IfNotPresent
            env:
              - name: BASE_URL
                value: http://orderservice:8080
            volumeMounts:
            - name: k6-config
              mountPath: /scripts/
          restartPolicy: OnFailure
          volumes:
            - name: k6-config
              secret:
                secretName: k6-config